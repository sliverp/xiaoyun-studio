<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF 演示稿 · 小云 Studio</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf3fa;font-family:system-ui,sans-serif;color:#233752}main{height:calc(100% - 42px);display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}.slide{margin:0;display:flex;align-items:center;justify-content:center;width:100%;height:100%}canvas{display:block;background:white;box-shadow:0 6px 24px #18325218;max-width:100%;max-height:100%}.pdf-text{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:pre-wrap}nav{height:42px;display:flex;gap:14px;align-items:center;justify-content:center;background:white;border-top:1px solid #d6e1ee;font-size:13px}button{border:1px solid #d1ddec;background:#f6f9fd;border-radius:6px;padding:4px 14px;color:#2c4c74}#status{position:absolute;left:12px;bottom:12px;color:#687e98;font-size:12px}#error{position:absolute;inset:40px;padding:20px;background:#fff5f5;border:1px solid #e7b0b0;color:#9a3131;white-space:pre-wrap}#error[hidden]{display:none}
</style></head><body><main><article class="slide active"><canvas id="pdf-canvas" aria-label="当前 PDF 页面"></canvas><div id="pdf-text" class="pdf-text"></div></article></main><nav><button id="prev" aria-label="上一页">上一页</button><span id="counter" data-slide-number="1" data-slide-count="1">正在读取 PDF</span><button id="next" aria-label="下一页">下一页</button></nav><span id="status">PDF</span><div id="error" hidden role="alert"></div><script type="module" src="/pdf-viewer.mjs"></script></body></html>
