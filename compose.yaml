services:
  studio:
    build: .
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT:-18080}:18080"
    environment:
      STUDIO_ADMIN_PASSWORD: ${STUDIO_ADMIN_PASSWORD:?Set a unique administrator password in .env (at least 12 characters)}
      STUDIO_SECURE_COOKIE: ${STUDIO_SECURE_COOKIE:-0}
      STUDIO_ASR_BASE_URL: ${STUDIO_ASR_BASE_URL:-}
      ALLOW_PRIVATE_PRESENTATIONS: ${ALLOW_PRIVATE_PRESENTATIONS:-0}
    volumes:
      - studio_data:/data
    shm_size: 512mb
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  asr:
    profiles: [voice]
    build: ./asr
    restart: unless-stopped
    volumes:
      - sensevoice_models:/models
    mem_limit: 2g
    expose: ["10095"]
volumes:
  studio_data:
  sensevoice_models:
